services:
  - type: web
    name: skyguard-demo
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skyguard-db
          property: connectionString
      - key: SKYGUARD_CORS_ORIGINS
        value: https://sky-guard-pyxnlz3ch-zenvorous.vercel.app,https://skyguard-demo.onrender.com
      - key: SKYGUARD_POLL_INTERVAL_SECONDS
        value: "900"

databases:
  - name: skyguard-db
    databaseName: skyguard
    user: skyguard
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"