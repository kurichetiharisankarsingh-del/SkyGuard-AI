<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyGuard AI</title>
    <style>
      body { margin: 0; background: #f3f7fb; color: #17212b; font-family: Segoe UI, sans-serif; }
      #startup-message { max-width: 680px; margin: 12vh auto; padding: 32px; }
      #startup-message h1 { margin: 0 0 12px; font-size: 2rem; }
      #startup-message p { line-height: 1.6; }
      #startup-message pre { overflow-x: auto; padding: 16px; background: #17212b; color: #f3f7fb; }
      #startup-message a { color: #075985; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-message">
        <p>SKYGUARD AI</p>
        <h1>Start the Vite development server</h1>
        <p>This React and TypeScript app cannot run from VS Code Live Server. Open a terminal in the <strong>frontend</strong> folder and run:</p>
        <pre>npm install
npm run dev</pre>
        <p>Then open <a href="http://localhost:5173/">http://localhost:5173/</a>. Keep the backend running on port 8000 for live data.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
